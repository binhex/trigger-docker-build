[general]
schedule_check_mins = integer(default=30)
log_level = string(default="INFO")
target_repo_owner = string(default="github_repo")
target_access_token = string(default="123456789")
last_check = string(default="")
# Verify TLS certificates on HTTPS requests. Set to False only behind an
# SSL-inspection proxy that uses self-signed certificates.
verify_ssl = boolean(default=True)

[monitor_sites]
site_list = string(default="[{'source_site_name': 'github|aor|aur|regex', 'source_repo_name': 'repo_name', 'source_app_name': 'app_name', 'source_query_type': 'release|tag', 'source_branch_name': 'branch_name', 'target_repo_name': 'repo_name', 'target_release_days': '7', 'action': 'trigger'}]")

[results]

[notification]
email_to = string(default="user@domain.com")
email_username = string(default="username")
email_password = string(default="password")
kodi_username = string(default="kodi")
kodi_password = string(default="kodi")
kodi_hostname = string(default="localhost")
kodi_port = string(default="80")
email_notification = boolean(default=True)
kodi_notification = boolean(default=False)
